name: 주간 뉴스 사이트 업데이트

on:
  push:
    branches: [main]
    paths:
      - 'data/weeks.json'   # 뉴스 데이터 변경 시 자동 실행
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # HTML 파일 커밋을 위해 필요

    steps:
      - name: Repository 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 패키지 설치
        run: pip install beautifulsoup4

      - name: HTML 사이트 생성
        run: python generate_site.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add education_news_brief_v4.html
          git diff --staged --quiet && echo "변경 없음" || (
            git commit -m "auto: 주간 뉴스 사이트 업데이트"
            git push
          )
