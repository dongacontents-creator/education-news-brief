name: 주간 교육 뉴스 자동 수집

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      target_date:
        description: '수집 기준 날짜 (YYYY-MM-DD, 빈칸=오늘)'
        required: false
        default: ''
      filter_hint:
        description: '특정 카테고리만 수집 (AI동향 / 업계동향 / 교육부 / 빈칸=전체)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests groq beautifulsoup4

      - name: 뉴스 수집
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS="--date \"${{ github.event.inputs.target_date }}\""
          if [ -n "${{ github.event.inputs.filter_hint }}" ]; then
            ARGS="$ARGS --filter-hint \"${{ github.event.inputs.filter_hint }}\""
          fi
          eval python collect_news.py $ARGS

      - name: data/weeks.json 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weeks.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "auto: 주간 교육 뉴스 자동 수집 $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install beautifulsoup4

      - name: HTML 사이트 생성
        run: python generate_site.py

      - name: 배포 파일 준비
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v4

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
