name: 주간 교육 뉴스 자동 수집

on:
  schedule:
    - cron: '0 23 * * 0'  # 매주 일요일 23:00 UTC = 월요일 08:00 KST
  workflow_dispatch:        # 수동 실행 (테스트용)

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests google-generativeai beautifulsoup4

      - name: 뉴스 수집 (네이버 API + Gemini Flash)
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
        run: python collect_news.py

      - name: HTML 사이트 재생성
        run: python generate_site.py

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weeks.json education_news_brief_v4.html
          git diff --staged --quiet && echo "변경 없음" || (
            git commit -m "auto: 주간 교육 뉴스 자동 수집 $(date +%Y-%m-%d)"
            git push
          )
