name: 주간 교육 뉴스 브리핑 발송

on:
  schedule:
    - cron: '0 3 * * 1'  # 매주 월요일 03:00 UTC = 월요일 12:00 KST
  workflow_dispatch:        # 수동 실행 버튼 (테스트용)

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Repository 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 패키지 설치
        run: pip install beautifulsoup4

      - name: 이메일 HTML 생성
        run: python generate_email.py

      - name: 교육 뉴스 브리핑 이메일 발송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: "📚 주간 교육 뉴스 브리핑"
          to: sewon.lee@dona-a.com, chaeyeon.kim@dong-a.com
          from: "교육 뉴스 브리핑 <dongacontents@gmail.com>"
          html_body: file://email_newsletter.html
          convert_markdown: false
