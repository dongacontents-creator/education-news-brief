<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 코드 리더</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e2e2de;
    --border-hover: #c8c8c2;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b66;
    --text-muted: #a0a09a;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --accent-border: #bfdbfe;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1rem 4rem;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .logo {
    width: 52px;
    height: 52px;
    background: var(--text-primary);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.25rem;
  }

  .logo svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: #fff;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* Drop zone */
  .drop-zone {
    background: var(--surface);
    border: 1.5px dashed var(--border-hover);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    outline: none;
    position: relative;
  }

  .drop-zone:hover,
  .drop-zone:focus {
    border-color: var(--accent);
    background: var(--accent-bg);
  }

  .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-bg);
    border-style: solid;
  }

  .drop-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 1rem;
    color: var(--text-muted);
  }

  .drop-zone h2 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .drop-zone p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .drop-zone .shortcut {
    display: inline-block;
    margin-top: 1rem;
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: monospace;
    color: var(--text-secondary);
  }

  /* Preview */
  .preview-wrap {
    display: none;
    margin-top: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
  }

  .preview-wrap img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    object-fit: contain;
  }

  .preview-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }

  /* Result */
  .result-box {
    display: none;
    margin-top: 1.5rem;
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
  }

  .result-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--success);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .result-label svg {
    width: 14px;
    height: 14px;
    stroke: var(--success);
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #result-text {
    font-size: 15px;
    color: var(--text-primary);
    word-break: break-all;
    line-height: 1.6;
  }

  #result-text a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .result-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
    text-decoration: none;
  }

  .btn:hover { background: var(--bg); border-color: var(--border-hover); }

  .btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }

  /* Error */
  .error-box {
    display: none;
    margin-top: 1.5rem;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: var(--radius);
    padding: 1rem 1.5rem;
    font-size: 14px;
    color: var(--danger);
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
  }

  .error-box svg {
    width: 16px;
    height: 16px;
    stroke: var(--danger);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* How-to hint */
  .hint {
    margin-top: 2rem;
    padding: 1.25rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .hint h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .hint ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .hint li {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
  }

  .hint-num {
    min-width: 20px;
    height: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  footer {
    margin-top: 2.5rem;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="4" height="4" rx="0.5"/><line x1="20" y1="14" x2="20" y2="14"/><line x1="18" y1="20" x2="20" y2="20"/><line x1="20" y1="18" x2="20" y2="20"/></svg>
    </div>
    <h1>QR 코드 리더</h1>
    <p>이미지를 붙여넣거나 드래그하면 바로 인식합니다</p>
  </header>

  <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="QR 코드 이미지 업로드">
    <div class="drop-icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="14" height="14" rx="2"/>
        <rect x="28" y="6" width="14" height="14" rx="2"/>
        <rect x="6" y="28" width="14" height="14" rx="2"/>
        <rect x="9" y="9" width="8" height="8" rx="1" fill="currentColor" stroke="none"/>
        <rect x="31" y="9" width="8" height="8" rx="1" fill="currentColor" stroke="none"/>
        <rect x="9" y="31" width="8" height="8" rx="1" fill="currentColor" stroke="none"/>
        <rect x="28" y="28" width="5" height="5" rx="1"/>
        <rect x="35" y="28" width="7" height="3" rx="1"/>
        <rect x="28" y="35" width="3" height="7" rx="1"/>
        <rect x="37" y="33" width="5" height="9" rx="1"/>
      </svg>
    </div>
    <h2>QR 코드 이미지를 여기에 놓으세요</h2>
    <p>드래그 앤 드롭 또는 클릭하여 파일 선택</p>
    <span class="shortcut">Ctrl + V</span>
    <input type="file" id="file-input" accept="image/*" style="display:none" aria-hidden="true">
  </div>

  <div class="preview-wrap" id="preview-wrap">
    <div class="preview-label">업로드된 이미지</div>
    <img id="preview" alt="QR 코드 이미지">
  </div>

  <div class="result-box" id="result-box">
    <div class="result-label">
      <svg viewBox="0 0 16 16"><polyline points="3,8 6,11 13,4"/></svg>
      인식 완료
    </div>
    <div id="result-text"></div>
    <div class="result-actions" id="result-actions"></div>
  </div>

  <div class="error-box" id="error-box">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="8"/><line x1="8" y1="11" x2="8" y2="11"/></svg>
    <span id="error-msg"></span>
  </div>

  <div class="hint">
    <h3>사용 방법</h3>
    <ul>
      <li>
        <span class="hint-num">1</span>
        화면에서 QR 코드를 캡처하거나 복사합니다 (Win: <strong>Win+Shift+S</strong>, Mac: <strong>Cmd+Shift+4</strong>)
      </li>
      <li>
        <span class="hint-num">2</span>
        이 페이지에서 <strong>Ctrl+V</strong> (Mac: Cmd+V)를 눌러 붙여넣습니다
      </li>
      <li>
        <span class="hint-num">3</span>
        QR 코드가 자동으로 인식되고 링크가 표시됩니다
      </li>
    </ul>
  </div>

  <footer>클라이언트에서만 처리되며 서버로 이미지를 전송하지 않습니다</footer>
</div>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const previewWrap = document.getElementById('preview-wrap');
  const preview = document.getElementById('preview');
  const resultBox = document.getElementById('result-box');
  const resultText = document.getElementById('result-text');
  const resultActions = document.getElementById('result-actions');
  const errorBox = document.getElementById('error-box');
  const errorMsg = document.getElementById('error-msg');

  let lastResultValue = '';
  let openUrl = '';

  function reset() {
    resultBox.style.display = 'none';
    errorBox.style.display = 'none';
  }

  function isURL(str) {
    try { new URL(str); return /^https?:\/\//i.test(str); } catch { return false; }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showResult(text) {
    lastResultValue = text;
    openUrl = '';
    reset();
    resultBox.style.display = 'block';

    if (isURL(text)) {
      openUrl = text;
      const safeHref = encodeURI(text);
      const safeDisplay = escapeHtml(text);
      resultText.innerHTML = `<a href="${safeHref}" target="_blank" rel="noopener noreferrer">${safeDisplay}</a>`;
      resultActions.innerHTML = `
        <button class="btn btn-primary" id="open-btn">
          <svg viewBox="0 0 14 14"><path d="M5 2H2a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9"/><polyline points="8,1 13,1 13,6"/><line x1="7" y1="7" x2="13" y2="1"/></svg>
          링크 열기
        </button>
        <button class="btn" id="copy-btn">
          <svg viewBox="0 0 14 14"><rect x="4" y="4" width="8" height="9" rx="1"/><path d="M2 10V2h8"/></svg>
          복사
        </button>`;
      document.getElementById('open-btn').addEventListener('click', () => window.open(openUrl, '_blank'));
    } else {
      resultText.innerHTML = `<span>${escapeHtml(text)}</span>`;
      resultActions.innerHTML = `
        <button class="btn" id="copy-btn">
          <svg viewBox="0 0 14 14"><rect x="4" y="4" width="8" height="9" rx="1"/><path d="M2 10V2h8"/></svg>
          복사
        </button>`;
    }

    document.getElementById('copy-btn').addEventListener('click', copyResult);
  }

  function showError(msg) {
    reset();
    errorBox.style.display = 'flex';
    errorMsg.textContent = msg;
  }

  function copyResult() {
    navigator.clipboard.writeText(lastResultValue).then(() => {
      const btn = document.getElementById('copy-btn');
      if (btn) {
        btn.textContent = '✓ 복사됨';
        setTimeout(() => {
          btn.innerHTML = `<svg viewBox="0 0 14 14" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect x="4" y="4" width="8" height="9" rx="1"/><path d="M2 10V2h8"/></svg> 복사`;
        }, 1500);
      }
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = lastResultValue;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  function decodeQR(imgEl) {
    const canvas = document.createElement('canvas');
    canvas.width = imgEl.naturalWidth;
    canvas.height = imgEl.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
    if (code && code.data) {
      showResult(code.data);
    } else {
      showError('QR 코드를 인식하지 못했습니다. 더 선명한 이미지로 다시 시도해 주세요.');
    }
  }

  function processBlob(blob) {
    if (!blob || !blob.type.startsWith('image/')) {
      showError('이미지 파일만 지원합니다.');
      return;
    }
    reset();
    const url = URL.createObjectURL(blob);
    previewWrap.style.display = 'block';

    // onload를 src 설정보다 먼저 등록해야 캐시된 이미지도 정상 처리됨
    preview.onload = () => {
      decodeQR(preview);
      URL.revokeObjectURL(url);
    };
    preview.onerror = () => {
      showError('이미지를 불러올 수 없습니다.');
      URL.revokeObjectURL(url);
    };
    preview.src = url;
  }

  function processFile(file) {
    processBlob(file);
  }

  // ── 붙여넣기 (Ctrl+V) ──────────────────────────────────────────
  document.addEventListener('paste', (e) => {
    e.preventDefault();
    const items = e.clipboardData?.items;
    if (!items) return;

    for (const item of items) {
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        processBlob(item.getAsFile());
        return;
      }
    }
    showError('클립보드에 이미지가 없습니다. QR 코드 이미지를 복사(캡처)한 뒤 Ctrl+V를 누르세요.');
  });

  // ── 드래그 앤 드롭 ──────────────────────────────────────────────
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
  });

  // ── 클릭하여 파일 선택 ──────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) processFile(e.target.files[0]);
    fileInput.value = '';
  });
</script>
</body>
</html>
